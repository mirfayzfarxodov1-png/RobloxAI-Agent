name: Quruvchi checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Verify Node version
        run: node --version
      - name: Syntax check browser scripts
        run: |
          node --check public/app.js
          node --check public/v2/index.js
          node --check public/super/index.js
          node --check public/avatar-3d.js
      - name: Syntax check all server and agent modules
        run: |
          find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: End-to-end tests
        run: npm test
